services:

  mysql:
    container_name: driving_analysis_mysql
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      TZ: Asia/Seoul   # ✅ 컨테이너 OS 시간대를 한국시간으로
    command: --default-authentication-plugin=mysql_native_password --default-time-zone=+09:00
    ports:
      - "${MYSQL_PORT}:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    container_name: driving_analysis_redis
    image: redis:7-alpine
    environment:
      TZ: Asia/Seoul   # ✅ Redis 컨테이너도 한국 시간대 (로그/만료시간 등 맞추기)
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data

  driving-analysis-service:
    container_name: driving_analysis_service
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      #      SPRING_DATASOURCE_URL: jdbc:mysql://smooth-database.c92iu2og4xc3.ap-northeast-2.rds.amazonaws.com:3306/${MYSQL_DATABASE}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      # Redis Stream 설정 추가
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      MYSQL_USERNAME: ${MYSQL_USERNAME}
      # Stream 설정
      DRIVING_STREAM_NAME: ${DRIVING_STREAM_NAME}
      DRIVING_CONSUMER_GROUP: ${DRIVING_CONSUMER_GROUP}
      DRIVING_CONSUMER_NAME: ${DRIVING_CONSUMER_NAME}
      REPORT_STREAM_NAME: ${REPORT_STREAM_NAME}
      REPORT_CONSUMER_GROUP: ${REPORT_CONSUMER_GROUP}
      REPORT_CONSUMER_NAME: ${REPORT_CONSUMER_NAME}
      # AWS 설정
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY}
      AWS_REGION: ${AWS_REGION}
      S3_OUTPUT: ${S3_OUTPUT}
      # ✅ JVM도 한국 시간으로
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Seoul

    ports:
      - "${APP_PORT}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  mysql_data:
  redis_data:
