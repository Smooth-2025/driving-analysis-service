spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/driving_analysis?serverTimezone=Asia/Seoul
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_ROOT_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2000ms


# Redis Streams 설정
redis:
  stream:
    driving:
      name: ${DRIVING_STREAM_NAME:driving.summary}
      group: ${DRIVING_CONSUMER_GROUP:driving-consumers}
      consumer: ${DRIVING_CONSUMER_NAME:worker-1}
    report:
      name: ${REPORT_STREAM_NAME:report.trigger}
      group: ${REPORT_CONSUMER_GROUP:report-consumers}
      consumer: ${REPORT_CONSUMER_NAME:report-worker-1}

# 로깅 설정
logging:
  level:
    root: INFO
    com.smooth.driving_analysis_service: DEBUG
    org.springframework.data.redis: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.zaxxer.hikari: DEBUG        # ← DB jdbcUrl/username 로그로 확인

# 서버 설정
server:
  port: 8080

# AWS 설정
cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
    region:
      static: ap-northeast-2
    stack:
      auto: false


athena:
  database: driving
  output-location: ${S3_OUTPUT}

progress:
  threshold: 15
